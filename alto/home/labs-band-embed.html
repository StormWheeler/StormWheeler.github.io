<a class="alband" href="/labs">
<style>

<style>
.alb{width:150px;height:150px;display:block}
.alb svg{display:block;overflow:visible}
.alb .alb-tree{stroke-dasharray:90;stroke-dashoffset:90;animation:albTree 6.4s infinite}
.alb .alb-n{opacity:0;transform-box:fill-box;transform-origin:center;animation:albNode 6.4s infinite}
.alb .alb-n2{animation-delay:.25s}.alb .alb-n3{animation-delay:.45s}.alb .alb-n4{animation-delay:.6s}
.alb .alb-b{opacity:0;animation:albBub 6.4s infinite}

.alb .alb-p{opacity:0;transform-box:fill-box;transform-origin:center bottom;animation:albProd 6.4s infinite}

.alb .alb-spark{opacity:0;animation:albSpark 6.4s infinite}
.alb .alb-glow{opacity:.35;animation:albGlow 6.4s infinite}

@keyframes albTree{0%,6%{stroke-dashoffset:90}30%,86%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:90}}
@keyframes albNode{0%,20%{opacity:0;transform:scale(.3)}26%{opacity:1;transform:scale(1.25)}30%,86%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(.3)}}

@keyframes albLiq{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}

</style>

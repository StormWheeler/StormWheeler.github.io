<!-- Existing Webflow nav-close behavior (keep) -->
<script>
  document.querySelectorAll('.w-nav-menu a').forEach(link => {
    link.addEventListener('click', () => {
      const menuBtn = document.querySelector('.w-nav-button');
      if (menuBtn && menuBtn.offsetParent !== null) {
        menuBtn.click();
      }
    });
  });
</script>

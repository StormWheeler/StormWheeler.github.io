<!-- Altiora language switch (early part): applies the chosen language before the page paints -->
<script>
(function () {
  var FILES = {"ar":"https://cdn.prod.website-files.com/68388043b4e79ad0df690cb6/6afa721b11b585310efdd11d_altiora-ar-v4.json","ru":"https://cdn.prod.website-files.com/68388043b4e79ad0df690cb6/6afa721ba53c57bb0d44793d_altiora-ru-v4.json","zh":"https://cdn.prod.website-files.com/68388043b4e79ad0df690cb6/6afa721b81690a91f90106f8_altiora-zh-v4.json","hi":"https://cdn.prod.website-files.com/68388043b4e79ad0df690cb6/6afa721b81690a91f9010709_altiora-hi-v4.json","fr":"https://cdn.prod.website-files.com/68388043b4e79ad0df690cb6/6afa721b81690a91f901071a_altiora-fr-v4.json"};
  var l = 'en';
  try {
    var q = new URLSearchParams(location.search).get('lang');
    if (q && (q === 'en' || FILES[q])) localStorage.setItem('altiora-lang', q);
    var s = localStorage.getItem('altiora-lang');
    if (s && FILES[s]) l = s;
  } catch (e) {}
  window.__altioraLang = l;
  if (l === 'en') return;
  var d = document.documentElement;
  d.setAttribute('lang', l === 'zh' ? 'zh-CN' : l);
  d.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
  d.classList.add('i18n-x', 'i18n-' + l, 'i18n-wait');
  var st = document.createElement('style');
  st.textContent = 'html.i18n-wait body{opacity:0!important}';
  document.head.appendChild(st);
  setTimeout(function () { d.classList.remove('i18n-wait'); }, 2500);
  window.__i18nP = fetch(FILES[l]).then(function (r) { return r.json(); });
  /* Decoys so the Connect page typing animation types English somewhere hidden; the translation is typed separately */
  document.addEventListener('DOMContentLoaded', function () {
    ['typewriter-text', 'typewriter-text2'].forEach(function (c) {
      var x = document.createElement('span'); x.className = c; x.hidden = true; x.setAttribute('data-i18n-decoy', '');
      document.body.insertBefore(x, document.body.firstChild);
    });
  });
})();
</script>

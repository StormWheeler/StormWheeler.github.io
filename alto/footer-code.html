<!-- Auto-close mobile nav menu script -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const navMenu = document.querySelector('.w-nav-menu');
    const navButton = document.querySelector('.w-nav-button');
    let manuallyOpened = false;

    if (navButton) {
      navButton.addEventListener('click', () => {
        manuallyOpened = !manuallyOpened;
      });
    }

    window.addEventListener('resize', () => {
      if (!manuallyOpened && navMenu && navMenu.classList.contains('w--open')) {
        navButton.click();
      }
    });
  });
</script>

    + '.av img{width:28px;height:28px;object-fit:contain}'
    + '.ht{flex:1;min-width:0}'
    + '.hn{font-family:Archivo,"Source Sans 3",system-ui,sans-serif;font-weight:600;font-size:17px;letter-spacing:.06em;line-height:1.2}'
    + '.w[dir=rtl] .hn{letter-spacing:0}'
    + '.hs{font-size:12.5px;color:var(--m);line-height:1.3;margin-top:2px;display:flex;align-items:center;gap:6px}'
    + '.hs i{width:7px;height:7px;border-radius:50%;background:var(--gr);display:inline-block;flex:none}'
    + '.lg,.x,.rs{background:transparent;border:1px solid var(--l);color:var(--t);border-radius:999px;cursor:pointer;font:inherit}'
    + '.lg{font-size:13px;padding:5px 11px;line-height:1.2}'
    + '.lg:hover,.rs:hover{border-color:var(--au);color:var(--au)}'
    + '.x,.rs{width:34px;height:34px;display:grid;place-items:center;padding:0}'
    + '.x:hover{border-color:var(--au);color:var(--au)}'
    + '.x svg,.rs svg{width:16px;height:16px}'
    + '.b{position:relative;flex:1;overflow-y:auto;padding:18px 16px 8px;scroll-behavior:smooth;overscroll-behavior:contain}'
    + '.b::-webkit-scrollbar{width:6px}.b::-webkit-scrollbar-thumb{background:var(--l);border-radius:3px}'
    + '.r{display:flex;gap:8px;margin:0 0 10px;align-items:flex-end}'
    + '.r.u{justify-content:flex-end}'
    + '.r .mi{width:26px;height:26px;border-radius:50%;background:var(--s);border:1px solid var(--l);display:grid;place-items:center;flex:none}'
    + '.r .mi img{width:18px;height:18px;object-fit:contain}'
    + '.m{max-width:82%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}'
    + '.r.a .m{background:var(--s);border:1px solid var(--l);border-bottom-left-radius:5px}'
    + '.w[dir=rtl] .r.a .m{border-bottom-left-radius:16px;border-bottom-right-radius:5px}'
    + '.r.u .m{background:var(--au);color:var(--g);border-bottom-right-radius:5px;font-weight:500}'
    + '.w[dir=rtl] .r.u .m{border-bottom-right-radius:16px;border-bottom-left-radius:5px}'
    + '.m ul{margin:6px 0 0;padding:0 0 0 18px;white-space:normal}.w[dir=rtl] .m ul{padding:0 18px 0 0}'
    + '.m li{margin:0 0 5px}.m li::marker{color:var(--au)}'
    + '.ls{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px 34px}.w[dir=rtl] .ls{margin:2px 34px 12px 0}'
    + '.lk{display:inline-flex;align-items:center;gap:6px;color:var(--au);text-decoration:none;font-size:14px;border:1px solid rgba(212,175,55,.45);border-radius:999px;padding:7px 13px;line-height:1.2}'
    + '.lk:hover{background:rgba(212,175,55,.1)}'
    + '.lk svg{width:12px;height:12px;flex:none}.w[dir=rtl] .lk svg{transform:scaleX(-1)}'
    + '.cs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px 34px}.w[dir=rtl] .cs{margin:4px 34px 14px 0}'
    + '.c{background:transparent;color:var(--t);border:1px solid var(--l);border-radius:999px;padding:8px 13px;font:inherit;font-size:14px;line-height:1.2;cursor:pointer;text-align:start;transition:border-color .15s ease,color .15s ease,background .15s ease}'
    + '.c:hover{border-color:var(--au);color:var(--au);background:rgba(212,175,55,.06)}'
    + '.c[disabled]{opacity:.45;cursor:default;border-color:var(--l);color:var(--m);background:transparent}'
    + '.ty{display:inline-flex;gap:5px;padding:14px 16px}'
    + '.ty i{width:7px;height:7px;border-radius:50%;background:var(--au);opacity:.35;animation:d 1.1s infinite ease-in-out}'
    + '.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}'
    + '@keyframes d{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}'
    + '.f{padding:10px 12px 12px;border-top:1px solid var(--l);background:var(--g)}'

    + '.ib:focus-within{border-color:rgba(212,175,55,.7)}'
    + '.in{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--t);font:inherit;font-size:16px;line-height:1.3;padding:7px 0}'
    + '.in::placeholder{color:#7E8F86}'

    + '.sd svg{width:16px;height:16px}.w[dir=rtl] .sd svg{transform:scaleX(-1)}'
    + '.nt{font-size:11.5px;color:#7E8F86;line-height:1.4;margin:8px 4px 0;text-align:center}'
    + '@media (max-width:480px){.p{right:0;left:0;bottom:0;top:0;width:auto;height:100%;height:100dvh;border-radius:0;border:0;padding-bottom:env(safe-area-inset-bottom)}.p.on~.lb,.lb.hide{display:none}.hd{padding-top:max(14px,env(safe-area-inset-top))}.lb{right:16px;bottom:max(16px,env(safe-area-inset-bottom))}}'
    + '@media (prefers-reduced-motion:reduce){.p,.lbtn,.c{transition:none}.ty i{animation:none;opacity:.7}.b{scroll-behavior:auto}}';

  var ICON = {
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
    restart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v5h5"/></svg>'
  };

  /* ---------- Build ---------- */
  var host = document.createElement('div');
  host.id = 'alto-assistant';
  var root = host.attachShadow ? host.attachShadow({ mode: 'open' }) : host;
  var lang = (document.documentElement.lang || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var started = false, busy = false, lastFocus = null;

  root.innerHTML = '<style>' + CSS + '</style>'
    + '<div class="w">'
    + '<div class="p" role="dialog" aria-modal="false" aria-labelledby="alto-n">'
    + '<div class="hd"><div class="av"><img alt="" src="' + LOGO + '"></div>'
    + '<div class="ht"><div class="hn" id="alto-n"></div><div class="hs"><i aria-hidden="true"></i><span class="hsub"></span></div></div>'
    + '<button class="lg" type="button"></button>'
    + '<button class="rs" type="button">' + ICON.restart + '</button>'
    + '<button class="x" type="button">' + ICON.x + '</button></div>'
    + '<div class="b" role="log" aria-live="polite" aria-relevant="additions"></div>'
    + '<form class="f" autocomplete="off"><div class="ib"><input class="in" type="text" maxlength="300" enterkeyhint="send">'
    + '<button class="sd" type="submit" disabled>' + ICON.send + '</button></div><p class="nt"></p></form>'
    + '</div>'
    + '<div class="lb"><button class="lbtn" type="button" aria-expanded="false"><img alt="" src="' + LOGO + '"></button><span class="tag" aria-hidden="true"></span></div>'
    + '</div>';

  function $(s) { return root.querySelector(s); }
  var W = $('.w'), P = $('.p'), B = $('.b'), F = $('.f'), IN = $('.in'), SD = $('.sd'), LB = $('.lb'), LBTN = $('.lbtn');

  function paint() {
    var t = T[lang];
    W.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    W.setAttribute('lang', lang);
    $('.hn').textContent = t.title;
    $('.hsub').textContent = t.sub;
    $('.lg').textContent = t.lang; $('.lg').setAttribute('aria-label', t.langLabel);
    $('.rs').setAttribute('aria-label', t.restart); $('.rs').title = t.restart;
    $('.x').setAttribute('aria-label', t.close);
    IN.placeholder = t.placeholder; IN.setAttribute('aria-label', t.placeholder);
    SD.setAttribute('aria-label', t.send);
    $('.nt').textContent = t.note;
    LBTN.setAttribute('aria-label', t.open);
    $('.tag').innerHTML = lang === 'ar' ? 'اسأل <b>ألتو</b>' : 'Ask <b>Alto</b>';
  }

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function scroll() { B.scrollTop = B.scrollHeight; }

  function botRow(content) {
    var r = el('div', 'r a'), mi = el('div', 'mi'), img = el('img'); img.alt = ''; img.src = LOGO; mi.appendChild(img);
    var m = el('div', 'm');
    if (typeof content === 'string') m.textContent = content;
    else { var ul = el('ul'); content.forEach(function (li) { ul.appendChild(el('li', null, li)); }); m.appendChild(ul); }
    r.appendChild(mi); r.appendChild(m); B.appendChild(r); return r;
  }
  function userRow(text) { var r = el('div', 'r u'); r.appendChild(el('div', 'm', text)); B.appendChild(r); scroll(); }

  function typing() {
    var r = el('div', 'r a'), mi = el('div', 'mi'), img = el('img'); img.alt = ''; img.src = LOGO; mi.appendChild(img);
    var m = el('div', 'm ty'); m.setAttribute('aria-hidden', 'true'); m.innerHTML = '<i></i><i></i><i></i>';
    r.appendChild(mi); r.appendChild(m); B.appendChild(r); scroll(); return r;
  }

  function disableOldChips() { var cs = B.querySelectorAll('.c'); for (var i = 0; i < cs.length; i++) cs[i].disabled = true; }

  function chips(keys) {
    var t = T[lang], wrap = el('div', 'cs');
    keys.forEach(function (k) {
      var tp = t.topics[k]; if (!tp || !tp.chip) return;
      var c = el('button', 'c', tp.chip); c.type = 'button';
      c.addEventListener('click', function () { if (busy) return; ask(k, tp.chip); });
      wrap.appendChild(c);
    });
    B.appendChild(wrap);
  }

  function links(list) {
    var wrap = el('div', 'ls');
    list.forEach(function (l) {
      var a = el('a', 'lk'); a.href = l[1]; a.innerHTML = ICON.arrow; a.insertBefore(document.createTextNode(l[0]), a.firstChild);
      if (l[1].charAt(0) === '/' && l[1].indexOf('#') > -1 && location.pathname === '/') a.addEventListener('click', function () { if (window.innerWidth <= 480) close(); });
      wrap.appendChild(a);
    });
    B.appendChild(wrap);
  }

  function settle(anchor) {
    if (!anchor) { scroll(); return; }
    B.scrollTop = Math.min(B.scrollHeight, Math.max(0, anchor.offsetTop - 10));
  }

  function say(parts, after, anchor) {
    busy = true;
    var i = 0;
    (function next() {
      if (i >= parts.length) { busy = false; if (after) after(); settle(anchor); return; }
      var tr = typing(), delay = reduce ? 150 : Math.min(1100, 380 + (typeof parts[i] === 'string' ? parts[i].length * 6 : 600));
      setTimeout(function () { tr.remove(); botRow(parts[i]); scroll(); i++; next(); }, delay);
    })();
  }

  function answer(key) {
    var t = T[lang], tp = t.topics[key];
    var anchor = B.lastElementChild;
    if (!tp) { say([t.fallback], function () { chips(t.start); }, anchor); return; }
    say(tp.a, function () { if (tp.links) links(tp.links); chips(tp.next || t.start); }, anchor);
  }

  function ask(key, label) { disableOldChips(); userRow(label); answer(key); }

  function welcome() {
    var t = T[lang]; B.innerHTML = ''; started = true;
    say([t.hello, t.pick], function () { chips(t.start); }, { offsetTop: 0 });
  }

  function open() {
    lastFocus = document.activeElement;
    P.classList.add('on'); W.classList.add('open'); LBTN.setAttribute('aria-expanded', 'true');
    if (window.innerWidth <= 480) LB.classList.add('hide');
    if (!started) welcome();
    setTimeout(function () { if (window.innerWidth > 480) IN.focus({ preventScroll: true }); else $('.x').focus({ preventScroll: true }); }, reduce ? 0 : 240);
  }
  function close() {
    P.classList.remove('on'); W.classList.remove('open'); LBTN.setAttribute('aria-expanded', 'false'); LB.classList.remove('hide');
    LBTN.focus({ preventScroll: true });
  }

  LBTN.addEventListener('click', function () { P.classList.contains('on') ? close() : open(); });
  $('.tag').addEventListener('click', open);
  $('.x').addEventListener('click', close);
  $('.rs').addEventListener('click', function () { if (!busy) welcome(); });
  $('.lg').addEventListener('click', function () { if (busy) return; lang = lang === 'en' ? 'ar' : 'en'; paint(); welcome(); });
  W.addEventListener('keydown', function (e) { if (e.key === 'Escape' && P.classList.contains('on')) { e.stopPropagation(); close(); } });
  IN.addEventListener('input', function () { SD.disabled = !IN.value.trim(); });
  F.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = IN.value.trim(); if (!v || busy) return;
    IN.value = ''; SD.disabled = true;
    disableOldChips(); userRow(v); answer(route(v));
  });

  /* Public hooks so any button on the site can open Alto, e.g. onclick="altoOpen()" */
  window.altoOpen = open; window.altoClose = close;

  paint();
  (document.body || document.documentElement).appendChild(host);
})();
</script>
